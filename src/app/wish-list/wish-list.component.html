@for (group of sortedGroups; track group) {
  <div>
    <h2>{{ group.date }}</h2>
    <ul>
      @for (wish of group.wishes; track wish) {
        <li>
          <div>{{ wish.name }}</div>
          @if(wish?.note){
            <div class="text-subtle">{{ wish.note }}</div>
          }
        </li>
      }
    </ul>
  </div>
}
